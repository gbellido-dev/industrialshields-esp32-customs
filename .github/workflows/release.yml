# Construye el paquete con scripts/build.sh y lo publica como release.
#  - Al subir una etiqueta v<version>-customs.<N> (p. ej. v2.7.1-customs.1).
#  - O a mano (Actions -> release -> Run workflow), indicando la etiqueta:
#    la crea sobre el commit elegido.
name: release

on:
  push:
    tags:
      - "v*-customs.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta de la release (p. ej. v2.7.1-customs.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la etiqueta
        run: |
          case "$TAG" in
            v*-customs.*) ;;
            *) echo "La etiqueta debe ser v<version>-customs.<N>: $TAG"; exit 1 ;;
          esac
          # Debe coincidir con BASE_VERSION y CUSTOMS de scripts/build.sh
          want="v$(sed -n 's/^BASE_VERSION="\(.*\)"/\1/p' scripts/build.sh)-customs.$(sed -n 's/^CUSTOMS="\([0-9]*\)".*/\1/p' scripts/build.sh)"
          [ "$TAG" = "$want" ] || { echo "La etiqueta $TAG no coincide con scripts/build.sh ($want)"; exit 1; }

      - name: Construir el paquete
        run: scripts/build.sh

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Ya existe: sustituir los ficheros (y quitar los de otro formato)
            gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
            for a in $(gh release view "$TAG" --json assets --jq '.assets[].name' | grep '\.tar\.bz2$' || true); do
              gh release delete-asset "$TAG" "$a" --yes
            done
            gh release edit "$TAG" --notes-file CHANGELOG.md
          else
            gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file CHANGELOG.md
          fi
